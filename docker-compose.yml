version: "3.9"

services:
  # === VPN 코디네이터 ===
  # headscale 은 상시 가동 리눅스로 이전 (scripts/deploy-headscale-ubuntu.sh)
  # 맥북에서 함께 띄우면 코디네이터가 둘이 되어 8080 충돌, 여기서는 정의하지 않음

  # === 로컬 LLM 서버 (--profile with-ollama 로 활성화) ===
  ollama:
    image: docker.io/ollama/ollama@sha256:5f7a20da9b4d42d1909b4693f90942135bcabc335ee42d529c0d143c44a92311
    container_name: ollama
    restart: unless-stopped
    profiles:
      - with-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # === 아웃바운드 감사 프록시 ===
  egress-proxy:
    build:
      context: ./infra/egress-proxy
    image: openclaw-egress-proxy:local
    container_name: egress-proxy
    restart: unless-stopped
    networks:
      - default
      - openclaw-internal
    expose:
      - "3128"
    volumes:
      - ./logs/egress-proxy:/var/log/squid
      - egress-proxy-cache:/var/cache/squid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # === AI 어시스턴트 ===
  openclaw:
    build:
      context: ./infra/openclaw
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-2026.2.15}
    image: openclaw:local
    container_name: openclaw
    restart: unless-stopped
    depends_on:
      egress-proxy:
        condition: service_healthy
    networks:
      - openclaw-internal
      - host-access
    ports:
      - "127.0.0.1:18789:18789"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.containers.internal:11434/v1}
      - NODE_ENV=production
      - IMSG_SSH_USER=${IMSG_SSH_USER}
      - HTTP_PROXY=${OPENCLAW_EGRESS_PROXY:-http://egress-proxy:3128}
      - HTTPS_PROXY=${OPENCLAW_EGRESS_PROXY:-http://egress-proxy:3128}
      - ALL_PROXY=${OPENCLAW_EGRESS_PROXY:-http://egress-proxy:3128}
      - NO_PROXY=${OPENCLAW_NO_PROXY:-localhost,127.0.0.1,host.containers.internal,ollama,headscale,egress-proxy}
    env_file:
      - ./.env
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ./config/openclaw.json:/home/node/.openclaw/openclaw.json:ro
      # Workspace for SOUL.md, AGENTS.md, USER.md (see docs/openclaw-workspace-setup.md)
      - ./workspace:/home/node/.openclaw/workspace
      # Agent guide for CLAUDE.md creation/editing (set AGENT_GUIDE_PATH in .env)
      - ${AGENT_GUIDE_PATH}:/home/node/agent-guide
      - ~/.openclaw/keys/openclaw_imsg:/home/node/.ssh/openclaw_imsg:ro
      - ./scripts/imsg-host:/usr/local/bin/imsg:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.containers.internal:host-gateway"

networks:
  openclaw-internal:
    driver: bridge
    internal: true
  host-access:
    driver: bridge

volumes:
  ollama-models:
  egress-proxy-cache:
  openclaw-data:
